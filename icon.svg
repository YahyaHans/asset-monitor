<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 苹果风格深空灰至纯黑渐变底座 -->
    <linearGradient id="bgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    
    <!-- iOS 经典系统蓝渐变曲线 -->
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>

    <!-- 柔和发光阴影效果 -->
    <filter id="iosGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 曲线下方区域渐变 -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(10, 132, 255, 0.35)"/>
      <stop offset="100%" stop-color="rgba(10, 132, 255, 0.0)"/>
    </linearGradient>

    <!-- iOS 顶端高光质感 -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.02)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.0)"/>
    </linearGradient>
  </defs>

  <!-- iOS 标准圆角矩形（Squircle）底座 -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- 苹果应用边缘高光细节 -->
  <rect width="512" height="512" rx="116" fill="url(#gloss)" pointer-events="none"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>

  <!-- 极简流光资产曲线（类似苹果股市 App 风格） -->
  <g transform="translate(0, 10)">
    <!-- 曲线下方柔和色块填充 -->
    <path d="M 96 350 C 160 350, 200 240, 256 220 C 312 200, 360 290, 416 140 L 416 410 L 96 410 Z" fill="url(#areaGrad)"/>

    <!-- 发光图层 -->
    <path d="M 96 350 C 160 350, 200 240, 256 220 C 312 200, 360 290, 416 140" fill="none" stroke="#0A84FF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#iosGlow)"/>

    <!-- 精致主曲线 -->
    <path d="M 96 350 C 160 350, 200 240, 256 220 C 312 200, 360 290, 416 140" fill="none" stroke="url(#curveGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 终端高亮呼吸圆点 -->
    <circle cx="416" cy="140" r="12" fill="#ffffff" filter="url(#iosGlow)"/>
    <circle cx="416" cy="140" r="7" fill="#0A84FF"/>
  </g>
</svg>
